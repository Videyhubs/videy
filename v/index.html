<script>
// =====================================================================
// PRE-LOADER HIDE LOGIC (multi-strategy)
// FIX: - Fallback timer dipendekkan dari 6s jadi 3s (configurable)
//      - Tambah min-display time agar tidak "flash"
//      - Pakai config dari VidvastConfig
// =====================================================================
(function () {
    var preLoader = document.getElementById('vidvastPreLoader');
    if (!preLoader) return;

    var hidden = false;
    var startTime = Date.now();
    var maxMs   = (window.VidvastConfig && VidvastConfig.preLoaderMaxMs) || 3000;
    var minMs   = (window.VidvastConfig && VidvastConfig.preLoaderMinMs) || 400;

    function hidePreLoader(reason) {
        if (hidden) return;
        var elapsed = Date.now() - startTime;
        if (elapsed < minMs) {
            // Tunggu sampai min display time tercapai
            setTimeout(function () { hidePreLoader(reason); }, minMs - elapsed);
            return;
        }
        hidden = true;
        try { console.log('[Vidvast PreLoader] hide:', reason || 'unknown'); } catch (e) {}
        preLoader.classList.add('hidden');
        setTimeout(function () {
            if (preLoader && preLoader.parentNode) {
                preLoader.parentNode.removeChild(preLoader);
            }
        }, 600);
    }

    window.__hideVidvastPreLoader = hidePreLoader;

    // Strategy 1: Fallback timer (configurable, default 3s)
    setTimeout(function () { hidePreLoader('fallback-' + (maxMs / 1000) + 's'); }, maxMs);

    // Strategy 2: Watch #video-error display changes
    try {
        var videoErrEl = document.getElementById('video-error');
        if (videoErrEl && window.MutationObserver) {
            new MutationObserver(function (mutations) {
                mutations.forEach(function (m) {
                    if (m.type === 'attributes' && m.attributeName === 'style') {
                        if (videoErrEl.style.display === 'block') hidePreLoader('video-error-visible');
                    }
                });
            }).observe(videoErrEl, { attributes: true, attributeFilter: ['style'] });
        }
    } catch (e) {}

    // Strategy 3: Watch video element style changes
    try {
        var vidEl = document.getElementById('video');
        if (vidEl && window.MutationObserver) {
            new MutationObserver(function (mutations) {
                mutations.forEach(function (m) {
                    if (m.type === 'attributes' && m.attributeName === 'style') {
                        if (vidEl.style.display === 'none') hidePreLoader('video-hidden');
                    }
                });
            }).observe(vidEl, { attributes: true, attributeFilter: ['style'] });
        }
    } catch (e) {}

    // Strategy 4: Poll video.error property
    var pollCount = 0;
    var pollInterval = setInterval(function () {
        pollCount++;
        try {
            var v = document.getElementById('video');
            if (v && v.error) {
                hidePreLoader('video-media-error');
                clearInterval(pollInterval);
                return;
            }
            if (pollCount > 10) clearInterval(pollInterval); // 5s max poll
        } catch (e) {}
    }, 500);
})();
</script>

<script>
// =====================================================================
// MAIN PLAYER LOGIC
// FIX:
// 1. Hapus delay 100ms (loadVideo dipanggil langsung)
// 2. Hapus hardcoded fallback ID "t4qLw89X1" - redirect ke home jika no ID
// 3. Gunakan VidvastCodec dari file terpisah (konsisten)
// 4. CDN fallback berurutan jika CDN utama gagal
// 5. Better error handling
// =====================================================================
var video       = document.getElementById("video");
var videoError  = document.getElementById("video-error");
var videoActions = document.querySelector(".video-actions");
var clickLayer  = document.getElementById("firstClickLayer");
var params      = new URLSearchParams(window.location.search);

// ---- GET ID ----
function getIdFromUrl() {
    var path    = window.location.pathname.replace(/^\/+|\/+$/g, "");
    var idParam = params.get("id");
    var raw     = idParam || path;

    if (!raw) return null; // FIX: jangan fallback ke ID hardcode

    try { console.log("[Vidvast] URL raw id:", raw); } catch (e) {}

    if (window.VidvastCodec && VidvastCodec.isEncoded(raw)) {
        var decoded = VidvastCodec.decode(raw);
        if (decoded) {
            try { console.log("[Vidvast] Decoded:", raw, "->", decoded); } catch (e) {}
            return decoded;
        }
    }
    return raw;
}

var id = getIdFromUrl();

// FIX: jika tidak ada ID, redirect ke home setelah 1.5s
if (!id) {
    setTimeout(function () {
        window.location.href = '../';
    }, 1500);
}

function loadVideo(src) {
    if (!video || !src) return;
    video.src = src;
    try { video.load(); } catch (e) {}
}

// ---- DETECT SOURCE ----
function detectSource(input) {
    if (!input) return null;
    try {
        input = decodeURIComponent(input);
        if (input.startsWith("http")) return input;

        if (/^\d+\/[a-f0-9]{8,}\/\d+\/\d+\/[^?]+(\.mp4)?$/i.test(input)) {
            input = input.replace(/\.mp4$/i, '');
            return "https://xgroovy.com/get_file/" + input + ".mp4/?br=4161";
        }
        if (/^\d+\/\d+\/\d+(\.mp4)?$/.test(input)) {
            if (!input.endsWith(".mp4")) input += ".mp4";
            return "https://www.xxxfollow.com/media/fans/post_public/" + input;
        }
        if (/^[a-z0-9]\/[a-z0-9]\/[a-z0-9]\/[^?]+\/full(\.mp4)?$/i.test(input)) {
            if (!input.toLowerCase().endsWith(".mp4")) input += ".mp4";
            return "https://cdn.xfree.com/xfree-prod/" + input;
        }
        if (/^[a-f0-9]{9,}$/i.test(input)) {
            return "https://cdn.aceimg.com/" + input + ".mp4";
        }
        return null;
    } catch (e) { return null; }
}

// ---- PLAY VIDEY (CDN fallback chain) ----
function playVidey(id) {
    var cdns = (window.VidvastConfig && VidvastConfig.VIDEO_CDNS) || [
        function (id) { return 'https://cdn.videy.co/'  + id + '.mp4'; },
        function (id) { return 'https://cdn2.videy.co/' + id + '.mp4'; },
        function (id) { return 'https://cdn.videy.co/'  + id + '.mov'; }
    ];

    var step = 0;
    function tryNext() {
        if (step >= cdns.length) {
            // Semua CDN gagal
            if (video) video.style.display = 'none';
            if (videoError) videoError.style.display = 'block';
            if (videoActions) videoActions.style.display = 'none';
            if (clickLayer) clickLayer.style.display = 'none';
            if (window.__hideVidvastPreLoader) window.__hideVidvastPreLoader('playVidey-error-final');
            return;
        }
        var src = cdns[step](id);
        if (video) {
            video.onerror = function () {
                step++;
                tryNext();
            };
            loadVideo(src);
        }
        step++;
    }
    tryNext();
}

// ---- MAIN (FIX: langsung, tanpa setTimeout 100ms) ----
(function main() {
    if (!id) return;
    var src = detectSource(id);
    if (src) {
        loadVideo(src);
        video.onerror = function () {
            video.style.display = 'none';
            videoError.style.display = 'block';
            videoActions.style.display = 'none';
            if (clickLayer) clickLayer.style.display = 'none';
            if (window.__hideVidvastPreLoader) window.__hideVidvastPreLoader('detectSource-error');
        };
    } else {
        playVidey(id);
    }
})();

// ---- VIDEO EVENT HANDLERS ----
video.oncanplay = function () {
    if (videoError) videoError.style.display = 'none';
    video.style.display = 'block';
    if (videoActions) videoActions.style.display = 'flex';
    if (window.__hideVidvastPreLoader) window.__hideVidvastPreLoader('oncanplay');
};

['loadedmetadata', 'loadeddata', 'canplaythrough', 'playing', 'stalled', 'abort', 'emptied'].forEach(function (evName) {
    video.addEventListener(evName, function () {
        if (window.__hideVidvastPreLoader) window.__hideVidvastPreLoader(evName);
    });
});

video.addEventListener('error', function () {
    if (window.__hideVidvastPreLoader) window.__hideVidvastPreLoader('video-error-toplevel');
});

// ---- CLICK LAYER ----
(function () {
    if (!clickLayer) return;
    clickLayer.addEventListener('click', function () { clickLayer.remove(); }, { once: true });
})();

// =====================================================================
// REDIRECT AFTER VIDEO ENDS → Smartlink
// FIX: ambil URL dari VidvastConfig (terpusat)
// =====================================================================
(function () {
    var REDIRECT_URL    = (window.VidvastConfig && VidvastConfig.redirectUrl) || 'https://omg10.com/4/11234278';
    var COUNTDOWN_SEC   = (window.VidvastConfig && VidvastConfig.countdownSeconds) || 0;
    var triggered       = false;
    var countdownInterval = null;

    function startCountdown() {
        if (triggered) return;
        if (!REDIRECT_URL) return;
        triggered = true;

        if (COUNTDOWN_SEC <= 0) {
            window.location.href = REDIRECT_URL;
            return;
        }
        var remaining = COUNTDOWN_SEC;
        countdownInterval = setInterval(function () {
            remaining--;
            if (remaining <= 0) {
                clearInterval(countdownInterval);
                window.location.href = REDIRECT_URL;
            }
        }, 1000);
    }

    video.addEventListener("ended", startCountdown);
    video.addEventListener("timeupdate", function () {
        if (triggered) return;
        if (video.duration && video.currentTime >= video.duration - 0.5) startCountdown();
    });
    video.addEventListener("play", function () {
        if (countdownInterval) {
            clearInterval(countdownInterval);
            countdownInterval = null;
        }
        triggered = false;
    });
})();

console.log("ID:", id);
</script>

    function getRealVideo() {
        var vid = document.getElementById("video");

                return;
            }
            var encoded = encodeUrl(real);
            window.open("../d/?url=" + encoded, "_blank");
        });
    }
})();

<!-- THEME TOGGLE -->
<script>
(function () {
    var STORAGE_KEY = 'vv-theme';
    var html = document.documentElement;
    var toggle = document.getElementById('themeToggle');
    if (!toggle) return;

    function getCurrentTheme() { return html.getAttribute('data-theme') || 'night'; }
    function setTheme(theme) {
        html.setAttribute('data-theme', theme);
        try { localStorage.setItem(STORAGE_KEY, theme); } catch (e) {}
        toggle.setAttribute('aria-label', theme === 'night' ? 'Enable light mode' : 'Enable dark mode');
        toggle.setAttribute('title', theme === 'night' ? 'Switch to light mode' : 'Switch to dark mode');
    }
    setTheme(getCurrentTheme());
    toggle.addEventListener('click', function () {
        setTheme(getCurrentTheme() === 'night' ? 'light' : 'night');
    });
})();
</script>
